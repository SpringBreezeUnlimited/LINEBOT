name: Trigger auto deployment for dev

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/dev-AutoDeployTrigger-a7c43e60-6474-4bc8-a6cc-b88d98072fb1.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEV_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: linebotacr-e8c3bgczfhdpfgfn.azurecr.io
          registryUsername: ${{ secrets.DEV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEV_REGISTRY_PASSWORD }}
          containerAppName: dev
          resourceGroup: linebot-rg
          imageToBuild: linebotacr-e8c3bgczfhdpfgfn.azurecr.io/dev:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


