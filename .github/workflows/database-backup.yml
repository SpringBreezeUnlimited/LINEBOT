name: Database backup

on:
  # 03:00 JST（日曜）のフルバックアップ
  schedule:
    - cron: "0 18 * * 0"
    - cron: "30 18 * * 1-6"
  workflow_dispatch:
    inputs:
      backup_type:
        description: "実行するバックアップ種別"
        required: true
        default: differential
        type: choice
        options:
          - full
          - differential

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      PGPASSWORD: ${{ secrets.BACKUP_DATABASE_PASSWORD }}
      PGSSLMODE: require

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Select backup type
        id: type
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TYPE: ${{ inputs.backup_type }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            backup_type="${MANUAL_TYPE}"
          elif [[ "${SCHEDULE}" == "0 18 * * 0" ]]; then
            backup_type="full"
          else
            backup_type="differential"
          fi
          echo "backup_type=${backup_type}" >> "${GITHUB_OUTPUT}"

      - name: Create full backup
        if: steps.type.outputs.backup_type == 'full'
        shell: bash
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?BACKUP_DATABASE_URL secret is required}"
          backup_dir="${RUNNER_TEMP}/database-backup"
          mkdir -p "${backup_dir}"
          filename="full-${GITHUB_RUN_ID}.dump"
          pg_dump "${DATABASE_URL}" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="${backup_dir}/${filename}"
          sha256sum "${backup_dir}/${filename}" > "${backup_dir}/${filename}.sha256"
          printf '%s\n' "full" > "${backup_dir}/backup-type"

      - name: Create differential backup
        if: steps.type.outputs.backup_type == 'differential'
        shell: bash
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?BACKUP_DATABASE_URL secret is required}"
          backup_dir="${RUNNER_TEMP}/database-backup"
          mkdir -p "${backup_dir}"
          filename="differential-${GITHUB_RUN_ID}.dump"
          # pg_dump のデータセクションをフルの後に取得する。
          # 復元時は、対象フルバックアップを先に戻してからこのダンプを適用する。
          pg_dump "${DATABASE_URL}" \
            --format=custom \
            --data-only \
            --no-owner \
            --no-privileges \
            --file="${backup_dir}/${filename}"
          sha256sum "${backup_dir}/${filename}" > "${backup_dir}/${filename}.sha256"
          printf '%s\n' "differential" > "${backup_dir}/backup-type"

      - name: Verify backup archive
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="${RUNNER_TEMP}/database-backup"
          archive="$(find "${backup_dir}" -maxdepth 1 -name '*.dump' -print -quit)"
          test -n "${archive}"
          pg_restore --list "${archive}" > /dev/null
          sha256sum --check "${archive}.sha256"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ steps.type.outputs.backup_type }}-${{ github.run_id }}
          path: ${{ runner.temp }}/database-backup/
          retention-days: 90
          if-no-files-found: error
